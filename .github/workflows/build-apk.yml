name: 🤖 Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger button

jobs:
  build-apk:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js setup
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Java setup (Android build ke liye)
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # 4. npm install
      - name: 📦 Install Dependencies
        run: npm install

      # 5. Expo prebuild - Android native folder generate karta hai
      - name: 🏗️ Generate Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # 6. Gradle cache (speed up build)
      - name: 🔧 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 7. Make gradlew executable
      - name: 🔑 Set Gradlew Permission
        run: chmod +x android/gradlew

      # 8. Build Release APK
      - name: 🚀 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      # 9. Find APK and rename it
      - name: 🔍 Find APK
        run: |
          find android/app/build/outputs/apk -name "*.apk" -type f
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk SuariKaAlarm.apk 2>/dev/null || \
          cp android/app/build/outputs/apk/release/app-release.apk SuariKaAlarm.apk 2>/dev/null || \
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} SuariKaAlarm.apk \;

      # 10. Upload APK as downloadable artifact
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Suari-Ka-Alarm-APK
          path: SuariKaAlarm.apk
          retention-days: 30

      # 11. Show download link in summary
      - name: 📋 Build Summary
        run: |
          echo "## ✅ APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** Suari Ka Alarm 🔔" >> $GITHUB_STEP_SUMMARY
          echo "**APK Name:** SuariKaAlarm.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download:" >> $GITHUB_STEP_SUMMARY
          echo "Actions tab → इस workflow run पर click करें → **Artifacts** section में **Suari-Ka-Alarm-APK** download करें" >> $GITHUB_STEP_SUMMARY
          ls -lh SuariKaAlarm.apk
