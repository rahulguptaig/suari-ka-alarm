<!DOCTYPE html>
<html>
<head>
  <title>Suari Ka Alarm - Icon Generator</title>
  <style>
    body { background: #080818; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; font-family: Arial; color: white; }
    canvas { border: 2px solid #7C5CFC; border-radius: 16px; }
    button { background: linear-gradient(135deg, #7C5CFC, #FF6B9D); border: none; color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <h1>🙈🐷 Suari Logo Icon Generator</h1>
  <p>Yeh HTML file browser mein kholo, phir buttons click karke icons download karo</p>
  
  <div class="row">
    <div class="item">
      <canvas id="icon1024" width="1024" height="1024"></canvas>
      <button onclick="download('icon1024', 'icon.png')">Download icon.png (1024x1024)</button>
    </div>
    <div class="item">
      <canvas id="adaptive" width="1024" height="1024"></canvas>
      <button onclick="download('adaptive', 'adaptive-icon.png')">Download adaptive-icon.png</button>
    </div>
    <div class="item">
      <canvas id="splash" width="1284" height="2778"></canvas>
      <button onclick="download('splash', 'splash.png')">Download splash.png</button>
    </div>
    <div class="item">
      <canvas id="favicon" width="32" height="32"></canvas>
      <button onclick="download('favicon', 'favicon.png')">Download favicon.png</button>
    </div>
    <div class="item">
      <canvas id="notif" width="96" height="96"></canvas>
      <button onclick="download('notif', 'notification-icon.png')">Download notification-icon.png</button>
    </div>
  </div>

  <script>
    function drawSuari(ctx, w, h, bgRadius = 0, showText = true) {
      const cx = w / 2;
      const cy = h * 0.42;
      const scale = w / 1024;
      
      // Background
      const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
      bgGrad.addColorStop(0, '#1A0A3A');
      bgGrad.addColorStop(1, '#080818');
      if (bgRadius > 0) {
        ctx.beginPath();
        ctx.roundRect(0, 0, w, h, bgRadius);
        ctx.fillStyle = bgGrad;
        ctx.fill();
      } else {
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);
      }

      // Stars
      [[0.1, 0.15], [0.88, 0.1], [0.15, 0.78], [0.83, 0.73], [0.2, 0.4], [0.76, 0.3]].forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x * w, y * h, 3 * scale, 0, Math.PI * 2);
        ctx.fillStyle = '#7C5CFC';
        ctx.fill();
      });

      // Body gradient
      const bodyGrad = ctx.createLinearGradient(cx - 240 * scale, cy - 230 * scale, cx + 240 * scale, cy + 230 * scale);
      bodyGrad.addColorStop(0, '#FF6B9D');
      bodyGrad.addColorStop(1, '#7C5CFC');

      // Head
      ctx.beginPath();
      ctx.ellipse(cx, cy, 240 * scale, 230 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = bodyGrad;
      ctx.fill();

      // Inner face
      ctx.beginPath();
      ctx.ellipse(cx, cy + 15 * scale, 195 * scale, 185 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 184, 208, 0.85)';
      ctx.fill();

      // Ears
      [-240, 240].forEach(dx => {
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy - 70 * scale, 65 * scale, 0, Math.PI * 2);
        ctx.fillStyle = bodyGrad;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy - 70 * scale, 45 * scale, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,184,208,0.8)';
        ctx.fill();
      });

      // Pig snout
      ctx.beginPath();
      ctx.ellipse(cx, cy + 80 * scale, 80 * scale, 60 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#FF8FA3';
      ctx.fill();
      // Nostrils
      [[-25, 0], [25, 0]].forEach(([dx]) => {
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy + 80 * scale, 22 * scale, 0, Math.PI * 2);
        ctx.fillStyle = '#D4607A';
        ctx.fill();
      });

      // Hands over eyes
      ctx.save();
      [-122, 122].forEach((dx, i) => {
        ctx.save();
        ctx.translate(cx + dx * scale, cy - 50 * scale);
        ctx.rotate(i === 0 ? -0.26 : 0.26);
        ctx.beginPath();
        ctx.ellipse(0, 0, 90 * scale, 70 * scale, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#7C5CFC';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 0, 75 * scale, 55 * scale, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#9B7FFF';
        ctx.fill();
        ctx.restore();
      });
      ctx.restore();

      // Glowing eyes
      [[-112, -55], [112, -55]].forEach(([dx, dy]) => {
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy + dy * scale, 35 * scale, 0, Math.PI * 2);
        ctx.fillStyle = '#7C5CFC';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy + dy * scale, 25 * scale, 0, Math.PI * 2);
        ctx.fillStyle = '#00D4FF';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + dx * scale, cy + dy * scale, 15 * scale, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + dx * scale + 5 * scale, cy + dy * scale - 5 * scale, 7 * scale, 0, Math.PI * 2);
        ctx.fillStyle = '#080818';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + dx * scale + 8 * scale, cy + dy * scale - 8 * scale, 3 * scale, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
      });

      // Smile
      ctx.beginPath();
      ctx.moveTo(cx - 52 * scale, cy + 118 * scale);
      ctx.quadraticCurveTo(cx, cy + 160 * scale, cx + 52 * scale, cy + 118 * scale);
      ctx.strokeStyle = '#D4607A';
      ctx.lineWidth = 6 * scale;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Bell hat
      const bellGrad = ctx.createLinearGradient(cx - 80 * scale, cy - 250 * scale, cx + 80 * scale, cy - 160 * scale);
      bellGrad.addColorStop(0, '#FFE082');
      bellGrad.addColorStop(1, '#FFB300');
      ctx.beginPath();
      ctx.ellipse(cx, cy - 215 * scale, 80 * scale, 60 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = bellGrad;
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx, cy - 230 * scale, 90 * scale, 20 * scale, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#FFE082';
      ctx.fill();
      // Bell top
      ctx.beginPath();
      ctx.roundRect(cx - 15 * scale, cy - 295 * scale, 30 * scale, 22 * scale, 5);
      ctx.fillStyle = '#FFB300';
      ctx.fill();

      // Cheeks
      [[-177, 50], [177, 50]].forEach(([dx, dy]) => {
        ctx.beginPath();
        ctx.ellipse(cx + dx * scale, cy + dy * scale, 45 * scale, 30 * scale, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,107,157,0.35)';
        ctx.fill();
      });

      // Text
      if (showText && h > 300) {
        const textY = h * 0.77;
        const grad = ctx.createLinearGradient(cx - 200, textY, cx + 200, textY);
        grad.addColorStop(0, '#FF6B9D');
        grad.addColorStop(1, '#7C5CFC');
        ctx.font = `bold ${110 * scale}px 'Arial Rounded MT Bold', Arial`;
        ctx.textAlign = 'center';
        ctx.fillStyle = grad;
        ctx.fillText('Suari', cx, textY);
        ctx.font = `${38 * scale}px Arial`;
        ctx.fillStyle = 'rgba(155,127,255,0.9)';
        ctx.fillText('Ka Alarm', cx, textY + 60 * scale);
      }
    }

    function drawNotifIcon(ctx, w, h) {
      ctx.fillStyle = '#00000000';
      ctx.fillRect(0, 0, w, h);
      // White bell on transparent
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.ellipse(w/2, h*0.52, w*0.35, h*0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(w*0.38, h*0.2, w*0.24, h*0.16);
      ctx.beginPath();
      ctx.arc(w/2, h*0.2, w*0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w/2, h*0.82, w*0.14, 0, Math.PI * 2);
      ctx.fill();
    }

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Draw all icons
    window.onload = () => {
      const c1 = document.getElementById('icon1024');
      drawSuari(c1.getContext('2d'), 1024, 1024, 220, true);

      const c2 = document.getElementById('adaptive');
      drawSuari(c2.getContext('2d'), 1024, 1024, 0, false);

      const c3 = document.getElementById('splash');
      const ctx3 = c3.getContext('2d');
      const splashBg = ctx3.createRadialGradient(642, 1389, 0, 642, 1389, 1500);
      splashBg.addColorStop(0, '#1A0A3A');
      splashBg.addColorStop(1, '#080818');
      ctx3.fillStyle = splashBg;
      ctx3.fillRect(0, 0, 1284, 2778);
      drawSuari(ctx3, 1284, 2778, 0, true);

      const c4 = document.getElementById('favicon');
      const ctx4 = c4.getContext('2d');
      const fg = ctx4.createLinearGradient(0, 0, 32, 32);
      fg.addColorStop(0, '#FF6B9D');
      fg.addColorStop(1, '#7C5CFC');
      ctx4.fillStyle = '#080818';
      ctx4.fillRect(0, 0, 32, 32);
      ctx4.font = 'bold 22px Arial';
      ctx4.textAlign = 'center';
      ctx4.fillStyle = fg;
      ctx4.fillText('S', 16, 24);

      const c5 = document.getElementById('notif');
      drawNotifIcon(c5.getContext('2d'), 96, 96);
    };
  </script>
</body>
</html>
